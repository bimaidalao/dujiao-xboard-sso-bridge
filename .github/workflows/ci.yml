name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php74:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Validate bridge PHP 7.4 compatibility
        run: find dujiao -type f -name '*.php' -exec php -l {} \;

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Make commands executable
        run: chmod +x bin/dx-bridge scripts/*.sh *.sh
      - name: Validate package
        run: bash scripts/validate.sh
